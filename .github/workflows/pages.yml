# Mise en ligne gratuite sur GitHub Pages.
#
# À chaque push sur `main`, le site est vérifié (lint + build), exporté en HTML
# pur, puis poussé tel quel sur la branche `gh-pages`, que GitHub publie sur
# https://<compte>.github.io/<dépôt>/ — aucun secret, aucun serveur, aucun
# domaine à acheter.
#
# Pourquoi une branche plutôt que `actions/deploy-pages` : activer Pages par
# l'API demande un droit d'administration que le jeton d'Actions n'a pas
# (« Resource not accessible by integration »). Pousser une branche `gh-pages`,
# lui, ne demande que `contents: write`.
name: GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer une publication à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: write

# Une publication à la fois ; on ne coupe pas celle en cours, pour ne jamais
# laisser le site à moitié déployé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Construire et publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Le site est servi dans un sous-dossier portant le nom du dépôt : liens,
      # images et canoniques doivent en tenir compte. Les deux valeurs se
      # déduisent du dépôt, rien n'est écrit en dur. Le nom du compte est mis en
      # minuscules : GitHub sert bien `RSitraka.github.io`, mais Next normalise
      # l'hôte des canoniques — sitemap et canoniques annonceraient sinon deux
      # graphies de la même adresse.
      - name: Adresse de publication
        run: |
          proprietaire=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          depot="${{ github.event.repository.name }}"
          {
            echo "BASE_PATH=/$depot"
            echo "NEXT_PUBLIC_SITE_URL=https://$proprietaire.github.io/$depot"
          } >> "$GITHUB_ENV"

      - name: Exporter le site en HTML
        env:
          STATIC_EXPORT: "1"
        run: npm run build

      - name: Adapter la sortie à Pages
        run: bash ops/preparer-pages.sh

      - name: Publier sur la branche gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7}"
          # Historique volontairement écrasé : `gh-pages` ne contient que la
          # dernière version du site, jamais du code source.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

      - name: Adresse du site
        run: |
          echo "### Site publié" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
